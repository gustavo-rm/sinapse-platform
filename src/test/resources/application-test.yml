# Profile used by the integration tests. The datasource comes from the container started
# by IntegrationTest, so nothing about it is declared here.

spring:
  jpa:
    properties:
      hibernate:
        # Statement counting, for the tests that assert a read model issues a fixed number of
        # queries whatever the size of the data. Without them an N+1 introduced later passes
        # every functional test and shows up only as latency in production.
        generate_statistics: true

logging:
  structured:
    format:
      console:

sinapse:
  rate-limit:
    # Repeated from the base configuration: a list is bound whole from the highest-priority
    # source that defines any of its elements. The limits are lowered so that a test can
    # exhaust a window in a handful of requests.
    routes:
      - id: probe
        path: /api/v1/probe/rate-limited
        phase: BEFORE_AUTHENTICATION
        limit: 3
        window: 1m
      - id: identity-authentication
        path: /api/v1/sessions
        phase: BEFORE_AUTHENTICATION
        limit: 5
        window: 1m
      - id: identity-email-verification
        path: /api/v1/email-verifications
        phase: BEFORE_AUTHENTICATION
        limit: 50
        window: 1m
      - id: identity-password-reset-confirmation
        path: /api/v1/password-resets/confirmation
        phase: BEFORE_AUTHENTICATION
        limit: 50
        window: 1m
      - id: identity-password-reset
        path: /api/v1/password-resets
        phase: BEFORE_AUTHENTICATION
        limit: 50
        window: 1m
      - id: educational-invite-redemption-origin
        path: /api/v1/invites/*/redemptions
        phase: BEFORE_AUTHENTICATION
        limit: 3
        window: 1m
      - id: educational-invite-redemption-account
        path: /api/v1/invites/*/redemptions
        phase: AFTER_AUTHENTICATION
        limit: 5
        window: 1m
      - id: educational-invite-preview-origin
        path: /api/v1/invites/*/preview
        phase: BEFORE_AUTHENTICATION
        limit: 50
        window: 1m
      - id: educational-invite-preview-account
        path: /api/v1/invites/*/preview
        phase: AFTER_AUTHENTICATION
        limit: 50
        window: 1m
      - id: learningrecord-retroactive-entry
        path: /api/v1/study-sessions/retroactive-entries
        phase: AFTER_AUTHENTICATION
        limit: 3
        window: 1m
      - id: planning-generation-request
        path: /api/v1/study-plans/generation-requests
        phase: AFTER_AUTHENTICATION
        limit: 3
        window: 1m
      - id: datarights-export
        path: /api/v1/me/data-export
        phase: AFTER_AUTHENTICATION
        limit: 3
        window: 1m
      # Repeated from the base configuration, and lowered so that a test can exhaust a window
      # in a handful of requests.
      - id: readmodel-classroom-students
        path: /api/v1/classrooms/*/students
        phase: AFTER_AUTHENTICATION
        limit: 50
        window: 1m
      - id: readmodel-student-panel
        path: /api/v1/classrooms/*/students/*/panel
        phase: AFTER_AUTHENTICATION
        limit: 50
        window: 1m
    # Registration is deliberately absent from this list. It is limited to five per hour in
    # the deployed configuration, and the suite registers many more accounts than that.

  read-model:
    # Narrow enough that a test can ask for one day more and be refused.
    max-window: 30d
    # Low enough that a test can produce more sessions than the cap allows and see it applied.
    max-recent-sessions: 5
    max-classroom-students: 200

  planning:
    # Narrow enough that a test can ask for one day more and be refused.
    max-schedule-window: 30d
    max-plan-history: 100
    generation:
      # A worker that fires on its own in the middle of a suite makes a failure depend on the
      # second the suite ran. The worker is driven by calling it.
      poll-cron: '-'
      max-attempts: 2
      # Zero, so that a released job is claimable again without the suite waiting. The backoff
      # arithmetic itself is exercised directly against the claim query.
      retry-backoff: 0s
      algorithm-params:
        population-size: 8
        generations: 3

  data-rights:
    # A job that fires on its own in the middle of a suite makes a failure depend on the second
    # the suite ran. The sweep is driven by calling it.
    sweep-cron: '-'

  learning-record:
    # Narrow enough that a test can ask for one day more and be refused.
    max-history-window: 30d
    max-retroactive-backdating: 7d
    # A job that fires on its own in the middle of a suite makes a failure depend on the hour
    # the suite ran. The consistency check is exercised by calling it.
    consistency-check-cron: '-'

  identity:
    # A job that fires on its own in the middle of a suite makes a failure depend on the hour
    # the suite ran. The sweep is exercised by calling it.
    majority-sweep-cron: '-'
    terms:
      - purpose: LEARNING_DATA_PROCESSING
        version: test-0
        body: 'Test fixture. Not a consent term.'
      - purpose: INSTITUTION_SHARING
        version: test-0
        body: 'Test fixture. Not a consent term.'
      - purpose: ACADEMIC_RESEARCH
        version: test-0
        body: 'Test fixture. Not a consent term.'
