# Local development profile.
#
# The URL has a default so that a developer can start the application against a
# PostgreSQL on the workstation. User and password are still read from the environment;
# no credential is written to a file in the repository.

spring:
  datasource:
    url: ${SINAPSE_DB_URL:jdbc:postgresql://localhost:5432/sinapse}

logging:
  structured:
    format:
      # Readable output while developing. Production keeps the structured format.
      console:
  level:
    br.com.sinapse.platform: DEBUG

sinapse:
  rate-limit:
    # Repeated from the base configuration on purpose. A list is bound whole from the
    # highest-priority source that defines any of its elements, so declaring the probe route
    # here would otherwise drop every policy declared there.
    routes:
      - id: probe
        path: /api/v1/probe/rate-limited
        phase: BEFORE_AUTHENTICATION
        limit: 5
        window: 1m
      - id: identity-registration
        path: /api/v1/accounts
        phase: BEFORE_AUTHENTICATION
        limit: 5
        window: 1h
      - id: identity-authentication
        path: /api/v1/sessions
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 5m
      - id: identity-email-verification
        path: /api/v1/email-verifications
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 5m
      - id: identity-password-reset-confirmation
        path: /api/v1/password-resets/confirmation
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 5m
      - id: identity-password-reset
        path: /api/v1/password-resets
        phase: BEFORE_AUTHENTICATION
        limit: 5
        window: 1h
      - id: educational-invite-redemption-origin
        path: /api/v1/invites/*/redemptions
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 10m
      - id: educational-invite-redemption-account
        path: /api/v1/invites/*/redemptions
        phase: AFTER_AUTHENTICATION
        limit: 10
        window: 10m
      - id: educational-invite-preview-origin
        path: /api/v1/invites/*/preview
        phase: BEFORE_AUTHENTICATION
        limit: 20
        window: 10m
      - id: educational-invite-preview-account
        path: /api/v1/invites/*/preview
        phase: AFTER_AUTHENTICATION
        limit: 20
        window: 10m

      - id: learningrecord-retroactive-entry
        path: /api/v1/study-sessions/retroactive-entries
        phase: AFTER_AUTHENTICATION
        limit: 30
        window: 1h

      - id: planning-generation-request
        path: /api/v1/study-plans/generation-requests
        phase: AFTER_AUTHENTICATION
        limit: 10
        window: 1h

      - id: datarights-export
        path: /api/v1/me/data-export
        phase: AFTER_AUTHENTICATION
        limit: 5
        window: 1h
      # The two teacher reads. Both compose several modules over a window the caller chooses,
      # and the class list aggregates the history of every student in the classroom — it is the
      # heaviest read in this system, and ADR 0013 says so before anything has been measured.
      # Keyed by account, because the routes are authenticated and what is being bounded is one
      # teacher asking for expensive work repeatedly. Generous by design: a teacher moving
      # between a class list and several panels is ordinary use, not abuse.
      - id: readmodel-classroom-students
        path: /api/v1/classrooms/*/students
        phase: AFTER_AUTHENTICATION
        limit: 60
        window: 10m
      - id: readmodel-student-panel
        path: /api/v1/classrooms/*/students/*/panel
        phase: AFTER_AUTHENTICATION
        limit: 120
        window: 10m

  read-model:
    # Ceiling on the window of a composed read. Narrower than the per-module ceilings on
    # purpose: a read model asks several modules for the same window at once, so the same span
    # costs more here than it does in any one of them. A month covers every screen the pilot
    # has, and a client wanting a term reads the modules directly.
    max-window: 31d
    # Hard caps on the two lists that come back whole. Section 1 of the API contract refuses a
    # generic pagination mechanism, so a bounded list needs a bound: these are what stop
    # "returned whole" from coming to mean "returned however large it got".
    max-recent-sessions: 50
    max-classroom-students: 200

  identity:
    session:
      # A workstation serves plain HTTP, and a Secure cookie would never be stored. This is
      # the only reason the flag is configurable; every deployed profile keeps it on.
      cookie-secure: false
    # Development placeholders. They exist so that registration can be exercised locally and
    # are marked as what they are. The wordings of a deployed environment are supplied by
    # whoever is responsible for them, and this file is not that place.
    terms:
      - purpose: LEARNING_DATA_PROCESSING
        version: dev-0
        body: 'Development placeholder. Not a consent term.'
      - purpose: INSTITUTION_SHARING
        version: dev-0
        body: 'Development placeholder. Not a consent term.'
      - purpose: ACADEMIC_RESEARCH
        version: dev-0
        body: 'Development placeholder. Not a consent term.'
