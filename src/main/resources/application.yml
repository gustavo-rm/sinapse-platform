# Base configuration. Cross-cutting decisions come from ADR 0009 and ADR 0010.
# Credentials are never written here: the datasource is read from the environment.

spring:
  application:
    name: sinapse-platform

  datasource:
    url: ${SINAPSE_DB_URL}
    username: ${SINAPSE_DB_USERNAME}
    password: ${SINAPSE_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway. Never "update", never "create": a schema created
      # by Hibernate is a schema no migration describes.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Instants are stored as timestamptz; the driver must not reinterpret them in
          # the zone of whatever host the JVM happens to run on.
          time_zone: UTC

  flyway:
    enabled: true
    # The schema is built by migrations from the first commit, so there is no legacy
    # state to baseline over. Turning this on would let an undescribed schema pass.
    baseline-on-migrate: false
    locations: classpath:db/migration

  mvc:
    # Request parameters and bodies must never reach a log.
    log-request-details: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      # Instants travel as ISO-8601 with offset, not as epoch numbers.
      write-dates-as-timestamps: false

server:
  port: ${SINAPSE_HTTP_PORT:8080}
  error:
    # Nothing about the failure is disclosed by the container. Error bodies are produced
    # by GlobalExceptionHandler, from a closed catalogue of texts.
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # Forwarded headers are not honoured globally. The only component that may consider
  # X-Forwarded-For is the rate limiter, and only for configured trusted proxies.
  forward-headers-strategy: none

management:
  server:
    # Separate port, bound to the loopback address, not published by the infrastructure.
    port: ${SINAPSE_MANAGEMENT_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      # Structured JSON with the correlation id carried in the logging context.
      console: ecs
  level:
    root: INFO
    # SQL and bound parameters would carry student data into the logs.
    org.hibernate.SQL: 'OFF'
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

sinapse:
  api:
    version: '@project.version@'
  time:
    # Zone the application performs internal operations in. It is not the zone of any
    # user: local times belonging to an account are interpreted in Account.timeZone.
    zone: UTC
  rate-limit:
    # Empty by default: with no trusted proxy configured, X-Forwarded-For is ignored and
    # the address reported by the container is used. Fill this in with the addresses of
    # the reverse proxy actually in front of the application, and with nothing else.
    trusted-proxies: []
    # Each prompt registers the policy for the routes it creates. ADR 0009 names the ones
    # that require limiting from the start: invite redemption, authentication, generation job
    # creation, e-mail verification and password recovery.
    #
    # Declaration order decides, so a specific path goes above a broader one. All of these are
    # anonymous routes, so they are keyed by client address and run before authentication;
    # the address comes from the infrastructure and never from a header.
    #
    # A profile that declares this list replaces it whole rather than adding to it: a list is
    # bound from the highest-priority source that defines any element of it.
    routes:
      # Registration is throttled because it writes a row and hashes a password on demand.
      - id: identity-registration
        path: /api/v1/accounts
        phase: BEFORE_AUTHENTICATION
        limit: 5
        window: 1h
      # Authentication. The limit bounds password guessing per origin; the Argon2 cost bounds
      # what each attempt is worth.
      - id: identity-authentication
        path: /api/v1/sessions
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 5m
      # Token consumption. Tokens are 256 bits, so this is not what makes guessing hopeless;
      # it is what keeps guessing from costing the database anything.
      - id: identity-email-verification
        path: /api/v1/email-verifications
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 5m
      - id: identity-password-reset-confirmation
        path: /api/v1/password-resets/confirmation
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 5m
      # Requesting a reset sends a message to an address somebody else chose. Without a limit
      # the route is a way of mailing a stranger repeatedly.
      - id: identity-password-reset
        path: /api/v1/password-resets
        phase: BEFORE_AUTHENTICATION
        limit: 5
        window: 1h

      # Invite redemption, limited twice over. This is the compensation for storing invite
      # codes in clear text, and section 7.2 of the architecture document states it as a
      # condition of that design rather than as later hardening: fifty bits of entropy
      # protect nothing against a caller who may guess without limit.
      #
      # Two policies on the same path, one per phase, because the two keys answer different
      # attacks. Keyed by origin, it bounds a script working through the code space; keyed by
      # account, it bounds a signed-in student doing the same from a fresh address each time.
      # Both filters run, so both limits have to be satisfied.
      - id: educational-invite-redemption-origin
        path: /api/v1/invites/*/redemptions
        phase: BEFORE_AUTHENTICATION
        limit: 10
        window: 10m
      - id: educational-invite-redemption-account
        path: /api/v1/invites/*/redemptions
        phase: AFTER_AUTHENTICATION
        limit: 10
        window: 10m
      # The preview reveals a classroom name and a teacher's name to whoever holds a code, so
      # it is guessable in exactly the same way and limited in exactly the same way.
      - id: educational-invite-preview-origin
        path: /api/v1/invites/*/preview
        phase: BEFORE_AUTHENTICATION
        limit: 20
        window: 10m
      - id: educational-invite-preview-account
        path: /api/v1/invites/*/preview
        phase: AFTER_AUTHENTICATION
        limit: 20
        window: 10m

      # Recording a session after the fact. Keyed by account, because the route is
      # authenticated and the thing being bounded is one student writing a study history they
      # did not study — an origin limit would bound a script and not that. It is generous
      # enough for a student catching up on a week they forgot to time, and far below what
      # composing a plausible term of study would need.
      - id: learningrecord-retroactive-entry
        path: /api/v1/study-sessions/retroactive-entries
        phase: AFTER_AUTHENTICATION
        limit: 30
        window: 1h

  identity:
    # Age from which consent is the holder's own to give. A parameter, not a constant: the
    # legal question is open (J1), and the default of 18 is the conservative reading.
    consent-age-threshold: 18
    # Days to reaffirm, in one's own name, a consent a guardian had granted (ADR 0004). The
    # account stays usable throughout.
    majority-grace-period-days: 30
    # Daily pass over the holders who have reached the threshold. Evaluated in the zone
    # configured under sinapse.time, never in the zone of the host. Set to "-" to disable.
    majority-sweep-cron: '0 15 3 * * *'
    tokens:
      email-verification: 24h
      password-reset: 1h
      majority-reaffirmation: 30d
    session:
      idle-timeout: 7d
      absolute-timeout: 30d
      cookie-name: sinapse_session
      cookie-path: /api/v1
      cookie-secure: true
    # The wordings of the consent terms. Empty here on purpose: this is a legal document, and
    # inventing placeholder text that someone would then be recorded as having accepted is
    # worse than refusing to register anyone. The operator supplies the texts; startup
    # publishes whatever is missing and never rewrites what is already published.
    terms: []

  educational:
    # Every invite expires. Omitting a lifetime uses this default; there is no way to ask for
    # a code that never expires, because a code in clear text that never expires is a
    # credential nobody remembers exists.
    default-invite-lifetime: 14d
    # A ceiling, so the mandatory expiry is not a formality a client can set to a century.
    max-invite-lifetime: 90d

  learning-record:
    # A history has no natural size, and this API has no generic pagination by decision, so
    # the window of a history read is mandatory and its span is capped here. Ninety days
    # covers a school term, which is the longest window a pilot screen has a reason to ask
    # for.
    max-history-window: 90d
    # How far back a session may be entered after the fact. Retroactive entry is the marked
    # exception of decision F5; without a bound it is a way of writing a study history that
    # was never studied, and the mark on the duration only means something while the history
    # it describes is recent enough to be remembered.
    max-retroactive-backdating: 7d
    # Daily pass looking for references to planned sessions that no longer exist. It reports
    # and never deletes: an orphan reference is the accepted cost of the missing foreign key,
    # and removing the evidence would be worse than the orphan. Set to "-" to disable.
    consistency-check-cron: '0 40 3 * * *'

  curriculum:
    # How long a topic of each effort band is planned for (ADR 0012). The band is what a
    # curator judges; the minutes are configuration precisely so that the number can be
    # calibrated against observed data instead of being asserted by whoever curated.
    #
    # THESE VALUES ARE AN ASSUMPTION, NOT A FINDING. They were chosen to be plausible and
    # evenly spaced, and no pilot data has confirmed them. Calibrating them against the
    # durations actually observed in completed study sessions is analysis work belonging to
    # the pilot; until then, read them as a starting point.
    effort-tier-duration:
      SHORT: 25m
      STANDARD: 50m
      LONG: 90m
      EXTENDED: 150m
